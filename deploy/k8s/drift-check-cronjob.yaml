apiVersion: batch/v1
kind: CronJob
metadata:
  name: pdm-drift-check
  namespace: pdm
spec:
  schedule: "*/30 * * * *" # every 30 minutes
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: pdm-drift-check
          restartPolicy: Never
          containers:
            - name: drift-check
              image: ghcr.io/OWNER/pdm-drift:latest
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://pdm-mlflow.pdm.svc.cluster.local:5000"
                - name: INFERENCE_LOG_DB
                  value: "/inference-log/inference_log.db"
                - name: PROMETHEUS_PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc.cluster.local:9091"
                - name: KUBE_NAMESPACE
                  value: "pdm"
              volumeMounts:
                - name: inference-log
                  mountPath: /inference-log
              # Measured peak ~377 MiB locally (MLflow + Evidently + a 16.7k-row reference).
              resources:
                requests: { cpu: "100m", memory: "384Mi" }
                limits: { cpu: "500m", memory: "768Mi" }
          volumes:
            - name: inference-log
              persistentVolumeClaim:
                claimName: pdm-inference-log
