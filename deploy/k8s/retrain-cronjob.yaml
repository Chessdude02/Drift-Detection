# Scheduled full retrain (weekly) — also the template drift/trigger_retrain.py clones
# into a one-off Job when drift crosses the configured threshold.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pdm-retrain
  namespace: pdm
spec:
  schedule: "0 3 * * 0" # weekly, Sunday 03:00
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: train
              image: ghcr.io/OWNER/pdm-train:latest
              # Train a candidate, then the champion/challenger gate decides whether it
              # replaces Production (config/champion_challenger.yaml). A rejected
              # candidate stays registered but is never promoted.
              command: ["python", "-m", "pdm.training.retrain"]
              args: ["--raw-dir", "/data/raw", "--config-name", "training.yaml"]
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://pdm-mlflow.pdm.svc.cluster.local:5000"
                # Outcome labels (pdm.labels): logged predictions + recorded outcomes.
                - name: INFERENCE_LOG_DB
                  value: "/inference-log/inference_log.db"
                - name: OUTCOME_DB
                  value: "/data/outcomes/outcomes.db"
                - name: LABELS_DIR
                  value: "/data/labels"
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: inference-log
                  mountPath: /inference-log
                  readOnly: true
              resources:
                requests: { cpu: "500m", memory: "512Mi" }
                limits: { cpu: "2", memory: "2Gi" }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: pdm-mlflow-data
            - name: inference-log
              persistentVolumeClaim:
                claimName: pdm-inference-log
                readOnly: true
