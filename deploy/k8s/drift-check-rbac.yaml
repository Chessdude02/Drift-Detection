# Grants the drift-check job's ServiceAccount just enough permission to read the
# retrain CronJob's template and create one-off Jobs from it — nothing broader.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdm-drift-check
  namespace: pdm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pdm-drift-check-trigger-retrain
  namespace: pdm
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["pdm-retrain"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pdm-drift-check-trigger-retrain
  namespace: pdm
subjects:
  - kind: ServiceAccount
    name: pdm-drift-check
    namespace: pdm
roleRef:
  kind: Role
  name: pdm-drift-check-trigger-retrain
  apiGroup: rbac.authorization.k8s.io
