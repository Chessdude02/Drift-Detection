apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pdm-serving
  namespace: {{ .Values.namespace }}
  labels:
    release: kube-prometheus-stack   # matches the label kube-prometheus-stack's Prometheus selects on
spec:
  selector:
    matchLabels:
      app: pdm-serving
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pdm-serving-shadow
  namespace: {{ .Values.namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: pdm-serving-shadow
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
