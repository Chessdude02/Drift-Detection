name: Rollback

# Reverts Production to the version tagged `rollback_production=true` — exactly one
# step back, never a full history walk (src/pdm/evaluation/registry.py, RUNBOOK.md).
#
# Two triggers:
#   1. Manual: a human runs this via workflow_dispatch.
#   2. Automatic: promote-staging-to-prod.yaml triggers this itself (via the GitHub API,
#      using `actions: write` on its own GITHUB_TOKEN — see that workflow's final step)
#      ONLY when its promotion gate step succeeded (a promotion actually happened) AND a
#      LATER step (the K8s deploy or the post-promotion health check) failed. A gate
#      REJECTION never triggers this: nothing was promoted, so there's nothing to roll
#      back from, and Production was already left untouched by that workflow.
#
# If the restored version is ALSO found to be bad, this workflow does not chain a
# second rollback — see RUNBOOK.md: that case is a manual, deliberate redeployment of a
# specific known-good version, not something to script.
#
# MLflow state (mlflow.db) is pulled from gs://<BEARING_DATA_BUCKET>/mlflow/ before the
# rollback step and pushed back immediately after - see build-and-push-dev.yaml's
# header comment and RUNBOOK.md's "known gaps (MLflow tracking persistence)" section.

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "MLflow registered model name"
        required: true
        default: "ims_bearing_rul"
      reason:
        description: "Why this rollback is being run (free text, for the run log only)"
        required: false
        default: "Manually triggered"

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Log reason
        run: |
          echo "Rollback reason: ${{ inputs.reason }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -e .

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Pull MLflow state from GCS
        id: pull_mlflow
        run: python scripts/mlflow_gcs_sync.py pull --bucket "${{ vars.BEARING_DATA_BUCKET }}" --db-path mlflow.db

      - name: Roll back Production in MLflow (rollback_production tag -> Production)
        id: rollback
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
        run: python scripts/rollback_production.py --model-name "${{ inputs.model_name }}"

      - name: Push MLflow state to GCS
        if: always() && steps.pull_mlflow.outcome == 'success'
        run: python scripts/mlflow_gcs_sync.py push --bucket "${{ vars.BEARING_DATA_BUCKET }}" --db-path mlflow.db

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml

      - name: Revert K8s deployment to the restored version's image
        env:
          KUBECONFIG: kubeconfig.yaml
        run: |
          helm upgrade --install pdm-serving deploy/helm/pdm-serving \
            --namespace pdm --create-namespace \
            --reuse-values \
            --set image.tag=${{ steps.rollback.outputs.image_tag }} \
            --wait --timeout 5m

      - name: Verify rollback health
        env:
          KUBECONFIG: kubeconfig.yaml
        run: kubectl argo rollouts status pdm-serving -n pdm --timeout 300s
