# Shared definitions for turning the IMS Bearing RUL regressor into a binary
# failure/healthy decision for holdout scoring (F2, precision, PR-AUC). Kept out of
# workflow YAML and out of training_bearing.yaml so it can be tuned without touching
# either CI logic or training hyperparameters.
failure:
  # A snapshot is labeled "failure" (ground truth) if its true RUL is <= this many
  # snapshots. Also used as the decision boundary on the model's *predicted* RUL to
  # produce a binary prediction (predicted_rul <= horizon -> predict "failure").
  #
  # This is DELIBERATELY one coupled value, not two independent thresholds: the label
  # definition and the decision boundary must always match, or F2/precision would be
  # scoring the model against a target it was never asked to hit. Confirmed as-is;
  # do not split into e.g. `label_horizon` / `decision_horizon` without also revisiting
  # whether that's still a meaningful classification problem.
  #
  # Calibrated against a horizon sweep on the real holdout_v1.csv (3rd_test) after
  # fixing the training split to cover the full RUL range (see
  # src/pdm/data/datasets.py::_bearing_split): horizon=5 (tuned against the ~20-24 row
  # synthetic fixtures) produced F2=0.0/precision=0.0 on real data - not a floor, just
  # tighter than the model's prediction noise near failure (predictions land in the
  # 9-30 range close to true failure, not single digits). horizon=30 balances
  # F2=0.747/precision=0.520/recall=0.839. See RUNBOOK.md's "known gaps" section for
  # why this calibration is a small-sample estimate (one failure event).
  horizon_snapshots: 30

holdout:
  version: v1
  path: data/holdout/holdout_v1.csv
  # MLflow experiment holdout_v1.csv's build run (and provenance metadata) is logged
  # under; separate from training/serving experiments since it's dataset versioning,
  # not a model run.
  mlflow_experiment: holdout_datasets
  # MLflow experiment a candidate's staging-evaluation run (scripts/score_on_holdout.py)
  # is logged under; scripts/promote_to_production.py searches this experiment to find
  # a candidate's latest staging scores.
  staging_eval_mlflow_experiment: ims_bearing_rul_staging_eval
