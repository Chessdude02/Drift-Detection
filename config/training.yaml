# Training configuration for the C-MAPSS RUL model.
dataset:
  type: cmapss                  # cmapss | ims_bearing (see pdm.data.datasets)
  subset: FD001                 # one of FD001-FD004
  raw_dir: data/raw
  processed_dir: data/processed
  rul_cap: 125                  # standard C-MAPSS RUL clipping ceiling

features:
  rolling_windows: [5, 10, 20]  # cycles, for rolling mean/std features
  sensor_columns:
    - sensor_2
    - sensor_3
    - sensor_4
    - sensor_7
    - sensor_8
    - sensor_9
    - sensor_11
    - sensor_12
    - sensor_13
    - sensor_14
    - sensor_15
    - sensor_17
    - sensor_20
    - sensor_21

model:
  algorithm: lightgbm           # lightgbm | xgboost
  params:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    random_state: 42
  val_split: 0.2

mlflow:
  experiment_name: cmapss_rul
  registered_model_name: cmapss_rul

evaluation:
  max_rmse: 35.0                # CI/model-validation gate threshold on holdout
