# Training configuration for the IMS Bearing RUL model.
dataset:
  type: ims_bearing
  raw_dir: data/raw_bearing
  rul_cap: null                  # no cap by default: a run-to-failure series' natural
                                  # RUL range (snapshot count) is already bounded

features:
  channels: [bearing1, bearing2, bearing3, bearing4]
  # Channel whose degradation defines RUL=0 at the last snapshot. This depends on which
  # real IMS test-to-failure experiment raw_dir points at - see data/README.md:
  #   2nd_test -> bearing1 (outer race failure)   <- this config assumes 2nd_test
  #   3rd_test -> bearing3 (outer race failure)
  #   1st_test -> not usable as-is: 8 channels (2 per bearing), not 4 - see data/README.md
  failure_channel: bearing1

model:
  algorithm: lightgbm            # lightgbm | xgboost
  params:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    random_state: 42
    min_child_samples: 5         # IMS runs have far fewer rows than C-MAPSS; keep leaves splittable
  # Random split across the full RUL range (see src/pdm/data/datasets.py::_bearing_split
  # for why this is deliberately NOT a temporal-tail holdout): the real, separate
  # data/holdout/holdout_v1.csv (3rd_test) is what actually validates generalization.
  val_split: 0.2

mlflow:
  experiment_name: ims_bearing_rul
  registered_model_name: ims_bearing_rul

evaluation:
  # max_rmse is NOT chosen as "current val_rmse plus a comfortable margin" - the
  # previous comment here claimed that and was wrong to. The operationally relevant
  # comparison is val_rmse against config/evaluation.yaml's failure_horizon_snapshots
  # (30): that's the decision window a deployed model's predictions actually gate -
  # "is this bearing failing within the next 30 snapshots (~5 hours)". If RMSE is
  # small relative to that window, a prediction near the boundary is reliable; if RMSE
  # is comparable to or larger than the window, prediction error swamps the decision
  # itself, regardless of what the training gate says.
  #
  # val_rmse has consistently come out to ~61.1 (deterministic, fixed random_state) -
  # that is 2.0x the 30-snapshot failure_horizon, not a small fraction of it. This
  # directly explains, not just correlates with, what holdout_v1.csv scoring showed at
  # horizon=30: precision=0.52 - roughly HALF of "failing soon" alerts are false
  # alarms. That is not a rounding error and not a bug; it is what RMSE 2x the
  # decision window predicts. A model whose error is this large relative to the
  # window it gates is not operationally trustworthy for confident near-boundary
  # classification, full stop.
  #
  # So: max_rmse=70.0 only gates against gross regression from the current (already
  # weak) baseline. val_rmse sits at 61.088/70.0 = 87% of this threshold - ~13%
  # headroom, not a comfortable buffer. A retrain with similar or marginally worse
  # RMSE would still pass without being any more trustworthy at the decision boundary;
  # a materially worse run would be caught. Do not read gate_passed=True as "this
  # model is ready" - it only means "not obviously worse than what we already have,
  # which itself isn't good enough yet."
  #
  # The bar for "operationally sound near the decision boundary" would be RMSE
  # comparable to or smaller than failure_horizon (<=30, ideally well under it). The
  # current model does not clear that bar. Getting there is model-quality work (better
  # features, different split/model choice - see RUNBOOK.md's "known gaps (failure-
  # horizon calibration)" section), not a config-threshold change.
  max_rmse: 70.0
