# Drift-check job configuration.
reference:
  # model: the reference logged with the current Production model (pdm.drift.reference);
  # file: `path`, seeded by scripts/seed_reference_data.py (local runs, older models).
  source: model
  model_name: cmapss_rul
  path: data/processed/reference.parquet
  min_reference_rows: 200

current_window:
  source: inference_log_db       # inference_log_db | file
  # Readings from the last lookback_hours (null = ignore time and use the last
  # lookback_rows), capped at lookback_rows so one check stays cheap.
  lookback_hours: 24
  lookback_rows: 500
  # Fewer distinct engines than this and the check is skipped: with 1-3 engines both
  # checks give 15-94% false alarms (docs/decisions.md D-8). Needs asset_id on requests.
  min_engines: 5

drift:
  threshold: 0.5                 # share of drifted columns (Evidently DataDriftPreset) that triggers retrain
  # Per-column test, applied against the life-stage-matched reference below. Evidently's
  # default (normed Wasserstein, 0.1) flags 90%+ of windows of unseen but normal FD001
  # engines, because engine-to-engine variation alone exceeds 0.1. The threshold is the
  # 99th percentile of normal windows on real FD001 data; re-run
  # scripts/calibrate_drift.py (results: reports/drift_calibration.json) if the
  # features, window size, model or reference data change.
  stattest: wasserstein
  stattest_threshold: 0.32
  columns:
    - sensor_2_roll_mean_20
    - sensor_3_roll_mean_20
    - sensor_4_roll_mean_20
    - sensor_7_roll_mean_20
    - sensor_8_roll_mean_20
    - sensor_9_roll_mean_20
    - sensor_11_roll_mean_20
    - sensor_12_roll_mean_20
    - sensor_13_roll_mean_20
    - sensor_14_roll_mean_20
    - sensor_15_roll_mean_20
    - sensor_17_roll_mean_20
    - sensor_20_roll_mean_20
    - sensor_21_roll_mean_20

# Resample the reference to the current window's predicted-RUL mix before the retrain
# check, so a fleet that is younger or older than the reference is not flagged as drift.
# Needs the reference's `predicted_rul` column (scripts/seed_reference_data.py) and the
# inference log's logged predictions. See src/pdm/drift/life_stage.py.
life_stage_matching:
  enabled: true
  bin_width: 10                  # predicted-RUL bin width, cycles
  max_rul: 130                   # last bin edge; everything above falls in one bin (RUL cap is 125)
  sample_rows: 5000              # size of the resampled reference
  seed: 0

# Per-sensor residual check (src/pdm/drift/sensor_check.py). Raises the SensorFaultSuspected
# alert via the pdm_sensor_fault gauge; never triggers retraining. The threshold is the
# 99th percentile, over normal windows, of the largest per-sensor score in the window;
# recalibrate with scripts/calibrate_drift.py.
sensor_check:
  enabled: true
  threshold: 0.46
  # A fault is reported only if removing at most this many sensors explains every flag;
  # otherwise the whole fleet shifted (sensor_verdict: system_wide_shift) and it is the
  # retrain check's call. Without this, a new fault mode (FD003) flagged all 14 sensors
  # and wrongly held its retrain as a "sensor fault" (docs/decisions.md D-21).
  max_culprits: 2
  # When drift says "retrain" but a sensor also looks faulty, hold the retrain for a
  # human instead (a broken sensor tripped the retrain check up to 9% of the time).
  hold_retrain_on_fault: true

retrain_trigger:
  namespace: pdm
  source_cronjob: pdm-retrain
  job_name_prefix: pdm-retrain-drift
